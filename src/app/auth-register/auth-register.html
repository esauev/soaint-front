<div class="col-md-6 offset-md-3">
  <form (ngSubmit)="onSubmit()">
    <h1>Registrar Usuario</h1>
    <div class="form-group">
      <label>Usuario: </label>
      <input type="text" class="form-control" [(ngModel)]="usuario" name="usuario" placeholder="Usuario" required="required" />
    </div>
    <div class="form-group">
      <label>Password: </label>
      <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Password" required="required" />
    </div>
    <div class="form-group">
      <label>Repetir Password: </label>
      <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="password" placeholder="Repeat the password" required="required" />
    </div>
    <button class="btn btn-info">Registrarse</button>
  </form>
</div>
